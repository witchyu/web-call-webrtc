# ตัวอย่าง /etc/turnserver.conf สำหรับ coturn บน VPS (ไม่ใช่บน Render)
# ใช้คู่กับ TURN_URLS + TURN_SECRET ในแอป (โหมด coturn-secret)
listening-port=3478
tls-listening-port=5349
fingerprint
use-auth-secret
static-auth-secret=ใส่ค่าเดียวกับ_TURN_SECRET
realm=turn.example.com
# external-ip=PUBLIC_IP          # ใส่ถ้าเซิร์ฟเวอร์อยู่หลัง NAT (เช่น AWS/GCP)
min-port=49152
max-port=65535
total-quota=100
stale-nonce
no-multicast-peers
no-cli
# กัน relay เข้าเครือข่ายภายใน
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
cert=/etc/letsencrypt/live/turn.example.com/fullchain.pem
pkey=/etc/letsencrypt/live/turn.example.com/privkey.pem
# เปิดพอร์ตที่ firewall: 3478 (UDP+TCP), 5349 (TCP), 49152-65535 (UDP)
